# GitHub Issue creation workflow for drift alerts
# Triggered by Get-Drifts.ps1 when drifts are detected

name: Create Drift Alert Issue

on:
  workflow_call:
    inputs:
      tenant_name:
        required: true
        type: string
      drift_count:
        required: true
        type: number
      drift_summary:
        required: true
        type: string
      monitor_id:
        required: false
        type: string

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Check for existing open issue
        id: check_issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TENANT_NAME: ${{ inputs.tenant_name }}
        with:
          script: |
            const tenant = process.env.TENANT_NAME;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: `drift-alert,${tenant}`
            });

            if (issues.data.length > 0) {
              core.setOutput('exists', 'true');
              core.setOutput('issue_number', issues.data[0].number);
            } else {
              core.setOutput('exists', 'false');
            }

      - name: Create new issue
        if: steps.check_issue.outputs.exists == 'false'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TENANT_NAME: ${{ inputs.tenant_name }}
          DRIFT_COUNT: ${{ inputs.drift_count }}
          DRIFT_SUMMARY: ${{ inputs.drift_summary }}
        with:
          script: |
            const tenant      = process.env.TENANT_NAME;
            const driftCount  = process.env.DRIFT_COUNT;
            const driftSummary = process.env.DRIFT_SUMMARY || '_(no summary provided)_';

            const title = `🚨 Configuration Drift Detected: ${tenant}`;
            const body = `## Drift Alert

            **Tenant:** \`${tenant}\`
            **Detected:** ${new Date().toISOString()}
            **Drift Count:** ${driftCount}

            ### Summary

            ${driftSummary}

            ### Next Steps

            1. Review the drifted configuration in the Entra portal
            2. Decide whether to:
               - **Accept the drift**: Update the YAML config to match current state
               - **Remediate**: Re-apply the baseline config
            3. Run \`Get-Drifts.ps1 -TenantName ${tenant}\` to verify resolution

            ### Commands

            \`\`\`powershell
            # View current drifts
            pwsh ./scripts/Get-Drifts.ps1 -TenantName ${tenant} -OutputFormat json

            # Re-apply baseline (remediate)
            pwsh ./scripts/Apply-Config.ps1 -TenantName ${tenant}

            # Take new snapshot (accept drift)
            pwsh ./scripts/Take-Snapshot.ps1 -Resources @('microsoft.entra.conditionalaccesspolicy')
            \`\`\`

            ---
            *This issue was automatically created by the drift detection workflow.*
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['drift-alert', tenant, 'automated']
            });

      - name: Update existing issue
        if: steps.check_issue.outputs.exists == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DRIFT_COUNT: ${{ inputs.drift_count }}
          DRIFT_SUMMARY: ${{ inputs.drift_summary }}
        with:
          script: |
            const driftCount  = process.env.DRIFT_COUNT;
            const driftSummary = process.env.DRIFT_SUMMARY || '_(no summary provided)_';

            const comment = `## Drift Still Present

            **Detected:** ${new Date().toISOString()}
            **Drift Count:** ${driftCount}

            ### Current Summary

            ${driftSummary}

            ---
            *Automated update from drift detection workflow.*
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.check_issue.outputs.issue_number }},
              body: comment
            });
